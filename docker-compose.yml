services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # The browser calls the API directly, so CORS must allow the frontend's origin.
      CORS_ORIGINS: http://localhost:3000
      DAY_AHEAD_CUTOFF: ${DAY_AHEAD_CUTOFF:-09:20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
